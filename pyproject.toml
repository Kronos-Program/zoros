[project]
name = "zoros"
version = "0.2.0"
description = "Coweave in Zero Obstruction Routine Orchestration System (ZOROS)"
authors = [
    {name = "Benjamin Bazor",email = "kronosprogram@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "PySide6>=6.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.3",
    "openai-whisper",
    "faster-whisper>=1.0.3",
    "whispercpp>=0.0.15",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.3",
    "aiohttp>=3.8.4",
    "PyYAML>=6.0.1",
    "colorama>=0.4.6",
    "coloredlogs>=15.0.1",
]


[project.scripts]
zoros = "zoros.cli:run"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
